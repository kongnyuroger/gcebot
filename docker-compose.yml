services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gcebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gcebot
      POSTGRES_PASSWORD: gcebot
      POSTGRES_DB: gcebot
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gcebot -d gcebot']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gcebot-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
